<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mega-Linter Report</title><style>
/* Styling for the generated reports/lint/megalinter-report.html (issue #195).
   Neutral dev-report look (not the RadioCalico brand palette) — this is an
   internal CI artifact, not user-facing product UI; see this issue's
   @claude review comment for that call. Inlined into the report's <style>
   by the CI "Stage report" step (docs/ci-drafts/mega-linter.yml,
   write-guard), never loaded standalone. */
:root {
  --bg: #f7f7f8;
  --card: #ffffff;
  --text: #1c1c1e;
  --muted: #6b7280;
  --border: #e5e7eb;
  --error: #dc2626;
  --warning: #d97706;
  --success: #16a34a;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 2rem;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
h1 {
  font-size: 1.5rem;
  margin: 0 0 0.25rem;
}
.subtitle {
  color: var(--muted);
  margin-bottom: 1.5rem;
  font-size: 0.9rem;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
}
.empty-state {
  color: var(--muted);
  font-size: 0.9rem;
}
.bar-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
  font-size: 0.85rem;
}
.bar-row:last-child {
  margin-bottom: 0;
}
.bar-label {
  width: 190px;
  flex-shrink: 0;
  color: var(--muted);
}
.bar-track {
  flex: 1;
  background: var(--bg);
  border-radius: 4px;
  overflow: hidden;
  height: 10px;
  display: flex;
}
.bar-fill-error {
  background: var(--error);
  height: 100%;
}
.bar-fill-warning {
  background: var(--warning);
  height: 100%;
}
.bar-count {
  width: 90px;
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}
ul#megalinter-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
ul#megalinter-list li {
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
}
ul#megalinter-list li:last-child {
  border-bottom: none;
}
ul#megalinter-list a {
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
}
ul#megalinter-list a:hover {
  text-decoration: underline;
}
</style></head><body>
<h1>🦙 Mega-Linter Report</h1>
<div class="subtitle">CSS &middot; JavaScript &middot; YAML &middot; HTML &mdash; generated every CI run</div>
<div class="card"><div id="megalinter-chart"></div></div>
<div class="card"><div id="megalinter-list"></div></div>
<script id="megalinter-markdown" type="text/plain">
## [🦙 MegaLinter](https://megalinter.io/8.8.0) status: ⚠️ WARNING

| Descriptor  |                              Linter                               |Files|Fixed|Errors|Warnings|Elapsed time|
|-------------|-------------------------------------------------------------------|----:|----:|-----:|-------:|-----------:|
|⚠️ CSS       |[stylelint](https://megalinter.io/8.8.0/descriptors/css_stylelint) |   12|     |    49|       0|       3.08s|
|⚠️ JAVASCRIPT|[eslint](https://megalinter.io/8.8.0/descriptors/javascript_eslint)|   91|     |    31|       0|       3.01s|
|⚠️ YAML      |[prettier](https://megalinter.io/8.8.0/descriptors/yaml_prettier)  |    8|     |     1|       3|        0.9s|
|✅ YAML      |[v8r](https://megalinter.io/8.8.0/descriptors/yaml_v8r)            |    8|     |     0|       0|       5.52s|
|⚠️ YAML      |[yamllint](https://megalinter.io/8.8.0/descriptors/yaml_yamllint)  |    8|     |    18|       0|       0.68s|
</script>
<script>
/**
 * Renders Mega-Linter's Markdown summary table (MARKDOWN_SUMMARY_REPORTER,
 * already enabled) as a single-file HTML report: a dependency-free CSS bar
 * chart plus a readable per-linter list. Issue #195.
 *
 * Loaded as a plain <script> global (no npm/imports), like the rest of this
 * repo's browser code. The CI "Stage report" step embeds this file's source
 * plus the raw Markdown summary directly into the generated
 * reports/lint/megalinter-report.html, so parsing/rendering happens in the
 * reader's browser when the report is opened — the file stays a single,
 * self-contained static page with no build step.
 */
(function (global) {
  const STATUS_ICONS = { success: "✅", warning: "⚠️", error: "❌" };

  function statusFromIcon(icon) {
    if (icon === "✅") return "success";
    if (icon === "❌") return "error";
    if (icon === "⚠️") return "warning";
    return "unknown";
  }

  function isSeparatorRow(line) {
    return /^\|[-:\s|]+\|$/.test(line);
  }

  function parseMegaLinterMarkdownTable(markdown) {
    const lines = markdown
      .split("\n")
      .map((line) => line.trim())
      .filter((line) => line.startsWith("|"));

    const rows = [];
    for (const line of lines) {
      if (isSeparatorRow(line)) continue;

      const cells = line
        .split("|")
        .slice(1, -1)
        .map((cell) => cell.trim());
      if (cells.length < 6) continue;
      if (/^descriptor$/i.test(cells[0])) continue;

      const [icon, ...descriptorParts] = cells[0].split(/\s+/);
      const linkMatch = cells[1].match(/\[(.*?)\]\((.*?)\)/);
      if (!linkMatch) continue;

      rows.push({
        status: statusFromIcon(icon),
        descriptor: descriptorParts.join(" "),
        linterName: linkMatch[1],
        linterUrl: linkMatch[2],
        files: parseInt(cells[2], 10) || 0,
        errors: parseInt(cells[4], 10) || 0,
        warnings: parseInt(cells[5], 10) || 0,
      });
    }
    return rows;
  }

  function widthPercent(value, max) {
    return max > 0 ? Math.round((value / max) * 100) : 0;
  }

  function buildChartBars(rows) {
    const maxErrors = Math.max(0, ...rows.map((r) => r.errors));
    const maxWarnings = Math.max(0, ...rows.map((r) => r.warnings));
    return rows.map((r) => ({
      descriptor: r.descriptor,
      linterName: r.linterName,
      errorWidthPercent: widthPercent(r.errors, maxErrors),
      warningWidthPercent: widthPercent(r.warnings, maxWarnings),
    }));
  }

  function renderReadableList(rows) {
    const ul = document.createElement("ul");
    rows.forEach((r) => {
      const li = document.createElement("li");
      const icon = STATUS_ICONS[r.status] || "";
      const link = document.createElement("a");
      link.href = r.linterUrl;
      link.textContent = r.linterName;

      li.appendChild(document.createTextNode(`${icon} ${r.descriptor} — `.trim() + " "));
      li.appendChild(link);
      li.appendChild(document.createTextNode(`: ${r.files} files, ${r.errors} errors, ${r.warnings} warnings`));
      ul.appendChild(li);
    });
    return ul;
  }

  global.MegaLinterReportRender = {
    parseMegaLinterMarkdownTable,
    buildChartBars,
    renderReadableList,
  };
})(window);
</script>
<script>
/* Bootstraps the generated reports/lint/megalinter-report.html (issue #195):
   reads the embedded Markdown summary, parses it via the also-inlined
   report-render.js, and renders the bar chart + readable list into the DOM.
   Inlined by the CI "Stage report" step (docs/ci-drafts/mega-linter.yml,
   write-guard) after report-render.js in the generated page — never loaded
   standalone, so it assumes window.MegaLinterReportRender already exists
   and #megalinter-markdown/#megalinter-chart/#megalinter-list are present. */
(function () {
  const markdown = document.getElementById("megalinter-markdown").textContent;
  const { parseMegaLinterMarkdownTable, buildChartBars, renderReadableList } = window.MegaLinterReportRender;

  const rows = parseMegaLinterMarkdownTable(markdown);
  const chart = document.getElementById("megalinter-chart");
  const list = document.getElementById("megalinter-list");

  if (rows.length === 0) {
    chart.textContent = "";
    const empty = document.createElement("p");
    empty.className = "empty-state";
    empty.textContent = "No linter data found in this run's summary.";
    list.appendChild(empty);
    return;
  }

  const bars = buildChartBars(rows);
  bars.forEach((bar, i) => {
    const row = document.createElement("div");
    row.className = "bar-row";

    const label = document.createElement("div");
    label.className = "bar-label";
    label.textContent = `${bar.descriptor} / ${bar.linterName}`;

    const track = document.createElement("div");
    track.className = "bar-track";
    const errorFill = document.createElement("div");
    errorFill.className = "bar-fill-error";
    errorFill.style.width = `${bar.errorWidthPercent}%`;
    const warningFill = document.createElement("div");
    warningFill.className = "bar-fill-warning";
    warningFill.style.width = `${bar.warningWidthPercent}%`;
    track.appendChild(errorFill);
    track.appendChild(warningFill);

    const count = document.createElement("div");
    count.className = "bar-count";
    count.textContent = `${rows[i].errors} err / ${rows[i].warnings} warn`;

    row.appendChild(label);
    row.appendChild(track);
    row.appendChild(count);
    chart.appendChild(row);
  });

  list.appendChild(renderReadableList(rows));
})();
</script>
</body></html>
