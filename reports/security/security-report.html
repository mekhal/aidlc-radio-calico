<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Calico — Security Scan Report</title>
    <link rel="icon" type="image/x-icon" href="../../favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@600;700&family=Open+Sans:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Issue #548: reuse index.html's own header/sidebar/footer chrome
         styling, reversing #544's "neutral standalone page" choice. -->
    <link rel="stylesheet" href="../../shared/tokens.css" />
    <link rel="stylesheet" href="../../album-promo.css" />
    <link rel="stylesheet" href="../../logo/logo.css" />
    <link rel="stylesheet" href="../../menu/menu.css" />
    <link rel="stylesheet" href="../../sidebar/sidebar.css" />
    <link rel="stylesheet" href="../../footer/footer.css" />
    <link rel="stylesheet" href="security-report.css" />
  </head>
  <body>
    <!-- Issue #548: header, sidebar, and footer are rendered by
         security-report-page.js (reusing index.html/album-promo.js's same
         shared chrome globals), same DOM-construction pattern as
         pages/about.html and tests/test-report-dashboard.html. -->
    <div id="security-report-root"></div>

    <!-- This page lives TWO directories below the repo root (reports/
         security/, not one like every other chrome-mounting page), so
         every base-path override below uses "../../" instead of "../" —
         see docs/knowledge-asset/published/
         root-relative-path-audit-for-nested-pages.md. Without these, the
         i18n fetch (shared/translations.js) and the sidebar's Test/Lint/
         Security Scan links (sidebar/sidebar.js, issue #299) would 404
         here. report-boot.js already independently defaults its own
         I18N_BASE_PATH to "../../i18n/" for the same reason. -->
    <script>
      window.__ALBUM_PROMO_I18N_BASE_PATH__ = "../../i18n/";
      window.__SIDEBAR_BASE_PATH__ = "../../";
    </script>

    <!-- Issue #548: same reusable chrome globals index.html/album-promo.js
         compose — must load before security-report-page.js, which calls
         createState()/buildLogo()/buildMenu()/buildSidebar()/buildFooter(). -->
    <script src="../../shared/state.js"></script>
    <script src="../../shared/translations.js"></script>
    <script src="../../shared/helpers.js"></script>
    <script src="../../logo/logo.js"></script>
    <script src="../../menu/menu.js"></script>
    <script src="../../sidebar/sidebar.js"></script>
    <script src="../../footer/footer.js"></script>

    <script src="report-render.js"></script>
    <script src="report-boot.js"></script>
    <script src="security-report-page.js"></script>
  </body>
</html>
