<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Calico — Test Report Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@600;700&family=Open+Sans:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- AC-A1: reuse index.html's own header/sidebar/footer chrome styling +
         each extracted component's own stylesheet (issue #245). -->
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../album-promo.css" />
    <link rel="stylesheet" href="../logo/logo.css" />
    <link rel="stylesheet" href="../menu/menu.css" />
    <link rel="stylesheet" href="../sidebar/sidebar.css" />
    <link rel="stylesheet" href="../footer/footer.css" />
    <link rel="stylesheet" href="test-report-dashboard.css" />
  </head>
  <body>
    <!-- Ticket A pattern (album-promo.js): header, sidebar, and footer are
         rendered by test-report-dashboard.js rather than hard-coded here. -->
    <div id="test-report-dashboard-root"></div>

    <!-- This page lives one directory below the repo root (tests/), so the
         i18n fetch base path (shared/translations.js, default "i18n/") must
         be overridden the same way tests/test-runner.html does. -->
    <script>
      window.__ALBUM_PROMO_I18N_BASE_PATH__ = "../i18n/";
    </script>

    <!-- AC-A1: same reusable chrome globals index.html/album-promo.js
         compose — must load before test-report-dashboard.js, which calls
         createState()/buildLogo()/buildMenu()/buildSidebar()/buildFooter(). -->
    <script src="../shared/state.js"></script>
    <script src="../shared/translations.js"></script>
    <script src="../shared/helpers.js"></script>
    <script src="../logo/logo.js"></script>
    <script src="../menu/menu.js"></script>
    <script src="../sidebar/sidebar.js"></script>
    <script src="../footer/footer.js"></script>

    <!-- AC1/AC3: reads the last saved run from localStorage — never re-runs
         the suite itself. -->
    <script src="report-storage.js"></script>
    <script src="test-report-dashboard.js"></script>
  </body>
</html>
