<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Calico — Test Report</title>
    <style>
      body {
        font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5eada;
        color: #231f20;
        margin: 0;
        padding: 24px;
      }
      h1 {
        font-family: "Montserrat", sans-serif;
        color: #1f4e23;
      }
      #summary {
        font-weight: 600;
        margin-bottom: 16px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 8px 12px;
        border-radius: 4px;
        margin-bottom: 4px;
      }
      li.pass {
        background: #d8f2d5;
      }
      li.fail {
        background: #f8d7da;
      }
      li .error {
        display: block;
        font-size: 0.875rem;
        color: #231f20;
        margin-top: 4px;
      }
      /* Test fixtures render off-screen so the report stays readable. */
      #fixtures {
        position: absolute;
        top: -10000px;
        left: -10000px;
      }
    </style>
  </head>
  <body>
    <h1>Radio Calico — Test Report</h1>
    <p id="summary">Running tests…</p>
    <ul id="results"></ul>
    <div id="fixtures"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

    <!-- Ticket C (issue #101), AC6: app.js fetches i18n/en.json + i18n/th.json
         relative to the page it's running from. This page lives one
         directory under the repo root (unlike the live index.html, which
         app.js's default "i18n/" path assumes), so it needs the "../" prefix
         — mirrors the existing window.__APP_JS_PATH__ override pattern. -->
    <script>
      window.__I18N_BASE_PATH__ = "../i18n/";
      window.__ALBUM_PROMO_I18N_BASE_PATH__ = "../i18n/";
    </script>

    <script src="assert.js"></script>
    <script src="mock-hls.js"></script>
    <script src="load-app.js"></script>

    <!-- issue #205: persists this run's results to localStorage (AC1), read
         by tests/test-report-dashboard.html — never the other way around. -->
    <script src="report-storage.js"></script>
    <script src="load-test-report-dashboard.js"></script>

    <!-- issue #158 (Ticket D): album-promo.js's own Now Playing data-fetch
         suite. Not app.js interface-function tests, so (like
         harness-serialization/skills-storage-in-repo below) wired directly
         here rather than into test-report-suite-files.js. -->
    <script src="mock-metadata-fetch.js"></script>
    <script src="load-album-promo.js"></script>
    <script src="now-playing-metadata-fetch.test.js"></script>
    <script src="now-playing-year-album-quality.test.js"></script>
    <script src="recently-played-list.test.js"></script>
    <script src="recently-played-modal.test.js"></script>
    <script src="now-playing-polling.test.js"></script>
    <script src="cover-art-fingerprint.test.js"></script>

    <!-- issue #220 (Option B): PlayerControls' real audio playback suite —
         same category as the Ticket D suites above (album-promo.js's own
         DOM surface, not app.js interface functions), so wired directly
         here rather than into test-report-suite-files.js. -->
    <script src="player-real-audio-playback.test.js"></script>

    <!-- issue #253 (Ticket 1): shared/state.js, shared/translations.js, and
         shared/helpers.js each tested standalone (not through album-promo.js),
         so — same category as the album-promo.js suites above — wired
         directly here rather than into test-report-suite-files.js. -->
    <script src="shared/load-shared-module.js"></script>
    <script src="shared/shared-state.test.js"></script>
    <script src="shared/shared-translations.test.js"></script>
    <script src="shared/shared-helpers.test.js"></script>

    <!-- issue #254 (Ticket 2 of #245): logo/logo.js tested standalone via
         shared/load-shared-module.js's generic loader (reused, not
         duplicated under tests/logo/ — same reasoning as the shared/ block
         above), plus an integration check against the mounted
         album-promo.js header — same category as the album-promo.js/shared
         suites above, so wired directly here rather than into
         test-report-suite-files.js. -->
    <script src="logo/logo.test.js"></script>
    <script src="logo/logo-header-integration.test.js"></script>

    <!-- issue #255 (Ticket 3 of #245): menu/menu.js tested standalone via
         shared/load-shared-module.js's generic loader (reused, not
         duplicated under tests/menu/ — same reasoning as the shared/ and
         logo/ blocks above), plus an integration check against the mounted
         album-promo.js header — same category as the album-promo.js/shared
         suites above, so wired directly here rather than into
         test-report-suite-files.js. -->
    <script src="menu/menu.test.js"></script>
    <script src="menu/menu-header-integration.test.js"></script>

    <!-- issue #256 (Ticket 4 of #245): sidebar/sidebar.js tested standalone
         via shared/load-shared-module.js's generic loader (reused, not
         duplicated under tests/sidebar/ — same reasoning as the shared/,
         logo/, and menu/ blocks above) — same category as the album-promo.js
         suites above, so wired directly here rather than into
         test-report-suite-files.js. -->
    <script src="sidebar/sidebar.test.js"></script>

    <!-- issue #257 (Ticket 5 of #245): footer/footer.js tested standalone
         via shared/load-shared-module.js's generic loader (reused, not
         duplicated under tests/footer/ — same reasoning as the shared/,
         logo/, menu/, and sidebar/ blocks above) — same category as the
         album-promo.js suites above, so wired directly here rather than
         into test-report-suite-files.js. -->
    <script src="footer/footer.test.js"></script>

    <!-- issue #228: elapsed-time counter (cumulative, not per-play) +
         autoplay-on-mount for PlayerControls — same category as the #220
         suite above, so wired directly here too. -->
    <script src="player-timer-and-autoplay.test.js"></script>

    <!-- issue #54: the list of "real" test files is shared with app.js's
         footer modal via test-report-suite-files.js (single source of
         truth) instead of being hand-duplicated here. -->
    <script src="test-report-suite-files.js"></script>
    <script>
      window.TEST_REPORT_SUITE_FILES.forEach(function (file) {
        document.write('<script src="' + file + '"><' + "/script>");
      });
    </script>

    <!-- Self-referential — each opens the Test Report modal as part of its
         own test, so they stay out of test-report-suite-files.js to avoid
         the modal's injected suite recursing into itself. -->
    <script src="load-app-isolation.test.js"></script>
    <script src="test-report-modal.test.js"></script>
    <script src="test-report-cdn-deps.test.js"></script>
    <script src="test-report-suite-completeness.test.js"></script>
    <script src="footer-test-report-button.test.js"></script>

    <!-- issue #67, AC2: not app.js interface-function tests, so the footer
         modal's scoped suite excludes them (test-report-suite-files.js) —
         wired directly here instead so they still run as part of the full
         report. -->
    <script src="harness-serialization.test.js"></script>
    <script src="skills-storage-in-repo.test.js"></script>

    <!-- issue #205: report-storage.js/test-report-dashboard.js have no
         app.js DOM surface (same category as the two files above), so their
         suites are wired directly here too. -->
    <script src="report-storage.test.js"></script>
    <script src="test-report-dashboard.test.js"></script>

    <script>
      (async function () {
        await window.TestHarness.allSettled();
        const results = window.TestHarness.getResults();
        const list = document.getElementById("results");
        const passed = results.filter((r) => r.passed).length;

        // issue #205, AC1: replace the previously stored run every time this
        // full suite finishes — the Test Report Dashboard reads only this.
        window.TestReportStorage.saveTestReport(results);

        results.forEach((result) => {
          const item = document.createElement("li");
          item.className = result.passed ? "pass" : "fail";
          item.textContent = `${result.passed ? "✓" : "✗"} ${result.name}`;
          if (!result.passed) {
            const error = document.createElement("span");
            error.className = "error";
            error.textContent = result.error;
            item.appendChild(error);
          }
          list.appendChild(item);
        });

        document.getElementById("summary").textContent =
          `${passed} / ${results.length} passed`;
      })();
    </script>
  </body>
</html>
