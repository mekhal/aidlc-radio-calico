    <style>
      body {
        font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5eada;
        color: #231f20;
        margin: 0;
        padding: 24px;
      }
      h1 {
        font-family: "Montserrat", sans-serif;
        color: #1f4e23;
      }
      #summary {
        font-weight: 600;
        margin-bottom: 16px;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 8px 12px;
        border-radius: 4px;
        margin-bottom: 4px;
      }
      li.pass {
        background: #d8f2d5;
      }
      li.fail {
        background: #f8d7da;
      }
      li .error {
        display: block;
        font-size: 0.875rem;
        color: #231f20;
        margin-top: 4px;
      }
      /* Test fixtures render off-screen so the report stays readable. */
      #fixtures {
        position: absolute;
        top: -10000px;
        left: -10000px;
      }
    </style>
  </head>

    <script src="test-report-dashboard-timeout.test.js"></script>

    <script>
      (async function () {
        await window.TestHarness.allSettled();
        const results = window.TestHarness.getResults();
        const list = document.getElementById("results");
        const passed = results.filter((r) => r.passed).length;

        // issue #205, AC1: replace the previously stored run every time this
        // full suite finishes — the Test Report Dashboard reads only this.
        window.TestReportStorage.saveTestReport(results);

        // issue #205, AC-B2: when this page is embedded in the dashboard's
        // hidden <iframe> (PR B's "Reload Test"/auto-run flow), tell it the
        // run is saved so it can hide its loading backdrop and re-render.
        // Guarded so this page still works standalone (opened directly, no
        // parent dashboard listening).
        if (window.parent && window.parent !== window && typeof window.parent.onTestRunComplete === "function") {
          window.parent.onTestRunComplete();
        }

        results.forEach((result) => {
          const item = document.createElement("li");
          item.className = result.passed ? "pass" : "fail";
          item.textContent = `${result.passed ? "✓" : "✗"} ${result.name}`;
          if (!result.passed) {
            const error = document.createElement("span");
            error.className = "error";
            error.textContent = result.error;
            item.appendChild(error);
          }
          list.appendChild(item);
        });

        document.getElementById("summary").textContent =
          `${passed} / ${results.length} passed`;
      })();
    </script>
