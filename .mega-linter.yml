# Mega-Linter config (issue #120, rescoped under issue #314).
#
# ENABLE is scoped to this repo's "Core Components" per issue #314's
# decision: JS + CSS (+ YAML/POWERSHELL, left untouched from issue #120 since
# #314 only named JS/CSS as Core and HTML/Markdown as Non-Core). HTML and
# MARKDOWN were dropped — issue #314 explicitly asked to disable linting for
# those as Non-Core, reversing part of issue #120's original "match the
# decided tech stack" scope (see
# docs/decisions/2026-07-19-mega-linter-scan-scope.md; issue #314's own
# decision doc is recorded at its close step).
#
#   - CSS/POWERSHELL stay enabled with no change in intent from #120: kept in
#     place for the moment either file type is actually used.
#
# Everything else Mega-Linter can auto-detect (Python, Go, Docker, Terraform,
# etc.) is deliberately left disabled: none of it is part of this repo's
# stack, and running those linters was pure wasted scan time.
ENABLE:
  - CSS
  - JAVASCRIPT
  - YAML
  - POWERSHELL

# Issue #314 (second round): narrow each Core descriptor down to the one
# linter this repo actually wants findings from, instead of every linter
# Mega-Linter bundles under that descriptor (e.g. YAML's prettier/v8r, which
# just add noise on top of yamllint). POWERSHELL has no linter listed here —
# there are no .ps1 files in this repo yet, so the descriptor never
# activates regardless; add its specific linter key once a script exists to
# verify against.
ENABLE_LINTERS:
  - JAVASCRIPT_STANDARD
  - CSS_STYLELINT
  - YAML_YAMLLINT

# COPYPASTE (jscpd) already doesn't run today — it isn't in ENABLE above —
# but disabling it explicitly keeps that intent from silently changing if
# ENABLE is ever broadened.
DISABLE_LINTERS:
  - COPYPASTE_JSCPD

# Generated/binary/report output — never source to lint.
FILTER_REGEX_EXCLUDE: "(reports/|megalinter-reports/|RadioCalicoStyle/.*\\.png$)"
