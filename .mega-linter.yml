# Mega-Linter config (issue #120, rescoped under issue #314, JS flavor
# rescoped again under issue #317, HTML re-added under issue #195).
#
# ENABLE is scoped to this repo's "Core Components" per issue #314's
# decision: JS + CSS (+ YAML/POWERSHELL, left untouched from issue #120 since
# #314 only named JS/CSS as Core and HTML/Markdown as Non-Core). Issue #314
# dropped HTML and MARKDOWN as Non-Core; issue #195 re-adds HTML only
# (@mekhal explicitly asked for it back in both the lint scope and the
# report — MARKDOWN stays out, matching #195's report scope of
# CSS+JavaScript+YAML+HTML), reversing that part of #314 (see
# docs/decisions/2026-07-19-mega-linter-scan-scope.md; issue #314's own
# decision doc is recorded at its close step).
#
#   - CSS/POWERSHELL stay enabled with no change in intent from #120: kept in
#     place for the moment either file type is actually used.
#
# Everything else Mega-Linter can auto-detect (Python, Go, Docker, Terraform,
# etc.) is deliberately left disabled: none of it is part of this repo's
# stack, and running those linters was pure wasted scan time.
ENABLE:
  - CSS
  - HTML
  - JAVASCRIPT
  - YAML
  - POWERSHELL

# Issue #317: JAVASCRIPT_STANDARD flagged 5,693 violations because this
# repo's actual house style (double quotes, semicolons, no space before a
# named function's paren) is deliberate but isn't Standard Style, and
# `standard` can't be configured to match it. Disabled here (rather than via
# the global ENABLE_LINTERS whitelist, which would also silently drop the
# still-wanted CSS/YAML/POWERSHELL linters) so JAVASCRIPT_ES (plain ESLint,
# config at .eslintrc.json) is the one enforcing house style, while every
# other language's default linters stay untouched. JAVASCRIPT_PRETTIER also
# drops out — it would just re-flag the same style choices from a different
# angle.
DISABLE_LINTERS:
  - JAVASCRIPT_STANDARD
  - JAVASCRIPT_PRETTIER

# Generated/binary/report output, plus Claude Code skill-authoring scripts
# under .claude/skills/ (issue #317) — Node-target helper scripts, not app
# code, that don't follow this repo's browser house style — are never
# source to lint.
FILTER_REGEX_EXCLUDE: "(reports/|megalinter-reports/|RadioCalicoStyle/.*\\.png$|\\.claude/skills/)"
