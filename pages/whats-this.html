<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Calico — What's this</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@600;700&family=Open+Sans:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Reuse index.html's own header/sidebar/footer chrome styling. -->
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../album-promo.css" />
    <link rel="stylesheet" href="../logo/logo.css" />
    <link rel="stylesheet" href="../menu/menu.css" />
    <link rel="stylesheet" href="../sidebar/sidebar.css" />
    <link rel="stylesheet" href="../footer/footer.css" />
    <link rel="stylesheet" href="../whats-this/whats-this.css" />
  </head>
  <body>
    <!-- Issue #402 (Ticket 1 of the "What's this" page story): standalone
         What's this page — header, sidebar, and footer are rendered by
         whats-this/whats-this-page.js (reusing index.html/album-promo.js's
         same shared chrome globals), same DOM-construction pattern as
         pages/about.html and case-study.html. AC6: no content sections yet —
         those land in Tickets 2-4. -->
    <div id="whats-this-root"></div>

    <!-- This page lives one directory below the repo root (pages/), so the
         i18n fetch base path (shared/translations.js, default "i18n/") must
         be overridden the same way pages/about.html does. Same reason for
         the sidebar base path (sidebar/sidebar.js, issue #299): without it,
         the Test/Lint/Security Scan sidebar links 404 here. -->
    <!-- Issue #403 (Ticket 2): whats-this/whats-this.js's loadWhatsThisContent()
         default data path ("data/") also needs the same one-directory-down
         "../" override, so it resolves to data/whats-this-content.json rather
         than pages/data/whats-this-content.json. -->
    <script>
      window.__ALBUM_PROMO_I18N_BASE_PATH__ = "../i18n/";
      window.__SIDEBAR_BASE_PATH__ = "../";
      window.__WHATS_THIS_DATA_PATH__ = "../data/";
    </script>

    <!-- Issue #253 (Ticket 1): state/translations/helpers shared across the
         logo/menu/sidebar/footer components — must load before
         whats-this-page.js, which calls their globals. -->
    <script src="../shared/state.js"></script>
    <script src="../shared/translations.js"></script>
    <script src="../shared/helpers.js"></script>

    <!-- Issue #254 (Ticket 2 of #245): logo component — must load before
         whats-this-page.js, which calls buildLogo() when building the header. -->
    <script src="../logo/logo.js"></script>

    <!-- Issue #255 (Ticket 3 of #245): menu component — must load before
         whats-this-page.js, which calls buildMenu() when building the header. -->
    <script src="../menu/menu.js"></script>

    <!-- Issue #256 (Ticket 4 of #245): sidebar component — must load before
         whats-this-page.js, which calls buildSidebar() when mounting the page. -->
    <script src="../sidebar/sidebar.js"></script>

    <!-- Issue #257 (Ticket 5 of #245): footer component — must load before
         whats-this-page.js, which calls buildFooter() when mounting the page. -->
    <script src="../footer/footer.js"></script>

    <!-- Issue #403 (Ticket 2 of the "What's this" page story): whats-this/
         whats-this.js's Section 1 ("What is this?") content builder — must
         load before whats-this-page.js, which calls loadWhatsThisContent()/
         buildWhatIsThisSection() when mounting the page. -->
    <script src="../whats-this/whats-this.js"></script>
    <script src="../whats-this/whats-this-page.js"></script>
  </body>
</html>
