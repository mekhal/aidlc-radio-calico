<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Calico — About</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@600;700&family=Open+Sans:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Reuse index.html's own header/sidebar/footer chrome styling. -->
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../album-promo.css" />
    <link rel="stylesheet" href="../logo/logo.css" />
    <link rel="stylesheet" href="../menu/menu.css" />
    <link rel="stylesheet" href="../sidebar/sidebar.css" />
    <link rel="stylesheet" href="../footer/footer.css" />
    <link rel="stylesheet" href="../about/about.css" />
  </head>
  <body>
    <!-- Issue #151 (Ticket 1 of the About page story): standalone About
         page — header, sidebar, and footer are rendered by
         about/about-page.js (reusing index.html/album-promo.js's same
         shared chrome globals), same DOM-construction pattern as
         case-study.html and tests/test-report-dashboard.html. Section
         content (color palette, Production-grade Standards, References &
         Acknowledgements) is out of scope for this ticket — see issue #151
         Tickets 2-4. -->
    <div id="about-root"></div>

    <!-- This page lives one directory below the repo root (pages/), so the
         i18n fetch base path (shared/translations.js, default "i18n/") must
         be overridden the same way tests/test-report-dashboard.html does.
         Same reason for the sidebar base path (sidebar/sidebar.js, issue
         #299): without it, the Test/Lint/Security Scan sidebar links 404
         here. -->
    <!-- Issue #151 (Ticket 2): about/about.js's loadAboutContent() default
         data path ("data/") also needs the same one-directory-down "../"
         override, so it resolves to data/about-content.json rather than
         pages/data/about-content.json. -->
    <script>
      window.__ALBUM_PROMO_I18N_BASE_PATH__ = "../i18n/";
      window.__SIDEBAR_BASE_PATH__ = "../";
      window.__ABOUT_DATA_PATH__ = "../data/";
    </script>

    <!-- Issue #253 (Ticket 1): state/translations/helpers shared across the
         logo/menu/sidebar/footer components — must load before
         about-page.js, which calls their globals. -->
    <script src="../shared/state.js"></script>
    <script src="../shared/translations.js"></script>
    <script src="../shared/helpers.js"></script>

    <!-- Issue #254 (Ticket 2 of #245): logo component — must load before
         about-page.js, which calls buildLogo() when building the header. -->
    <script src="../logo/logo.js"></script>

    <!-- Issue #255 (Ticket 3 of #245): menu component — must load before
         about-page.js, which calls buildMenu() when building the header. -->
    <script src="../menu/menu.js"></script>

    <!-- Issue #256 (Ticket 4 of #245): sidebar component — must load before
         about-page.js, which calls buildSidebar() when mounting the page. -->
    <script src="../sidebar/sidebar.js"></script>

    <!-- Issue #257 (Ticket 5 of #245): footer component — must load before
         about-page.js, which calls buildFooter() when mounting the page. -->
    <script src="../footer/footer.js"></script>

    <!-- Issue #151 (Ticket 2 of the About page story): about/about.js's
         section builders — must load before about-page.js, which calls
         loadAboutContent()/buildProjectSection() when mounting the page. -->
    <script src="../about/about.js"></script>
    <script src="../about/about-page.js"></script>
  </body>
</html>
