<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio Calico — Case Study</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@600;700&family=Open+Sans:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="shared/tokens.css" />
    <link rel="stylesheet" href="album-promo.css" />
    <link rel="stylesheet" href="logo/logo.css" />
    <link rel="stylesheet" href="menu/menu.css" />
    <link rel="stylesheet" href="sidebar/sidebar.css" />
    <link rel="stylesheet" href="footer/footer.css" />
    <link rel="stylesheet" href="case-study/case-study.css" />
  </head>
  <body>
    <!-- Issue #323 (rework, 2026-08-13): standalone Case Study page — header,
         sidebar, footer, and the Case Study section are all rendered by
         case-study/case-study-page.js (reusing index.html/album-promo.js's
         same shared chrome globals), same DOM-construction pattern as
         index.html and tests/test-report-dashboard.html. -->
    <div id="case-study-root"></div>

    <!-- Issue #253 (Ticket 1): state/translations/helpers shared across the
         logo/menu/sidebar/footer components — must load before
         case-study-page.js, which calls their globals. -->
    <script src="shared/state.js"></script>
    <script src="shared/translations.js"></script>
    <script src="shared/helpers.js"></script>

    <!-- Issue #254 (Ticket 2 of #245): logo component — must load before
         case-study-page.js, which calls buildLogo() when building the header. -->
    <script src="logo/logo.js"></script>

    <!-- Issue #255 (Ticket 3 of #245): menu component — must load before
         case-study-page.js, which calls buildMenu() when building the header. -->
    <script src="menu/menu.js"></script>

    <!-- Issue #256 (Ticket 4 of #245): sidebar component — must load before
         case-study-page.js, which calls buildSidebar() when mounting the page. -->
    <script src="sidebar/sidebar.js"></script>

    <!-- Issue #257 (Ticket 5 of #245): footer component — must load before
         case-study-page.js, which calls buildFooter() when mounting the page. -->
    <script src="footer/footer.js"></script>

    <!-- Issue #323 (Ticket 2 of #203): Case Study Highlight Cards — must
         load before case-study-page.js, which calls buildCaseStudySection()
         when mounting the page's <main>. -->
    <script src="case-study/case-study.js"></script>

    <script src="case-study/case-study-page.js"></script>
  </body>
</html>
